<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验 · PaperTrail</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffefa;color:#26332b;font:14px/1.8 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:32px 5%}a{color:#28563b}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:20px 0 30px}h1{font-size:32px;color:#28563b;overflow-wrap:anywhere}section{border:1px solid #dce2d9;border-radius:9px;margin:24px 0;overflow:hidden}h2{font-size:17px;margin:0;padding:17px 22px;background:#f7f7f2;border-bottom:1px solid #dce2d9}button{font:inherit;cursor:pointer;padding:10px 16px;border:1px solid #c7d7c0;border-radius:7px;background:#edf3e9;color:#28563b;text-align:left}button:focus-visible,a:focus-visible{outline:3px solid #7f9d75;outline-offset:4px}.map{display:flex;gap:32px;align-items:center;padding:28px;overflow:auto;min-height:220px}.branches{border-left:1px solid #b0c6a5;padding-left:24px;display:grid;gap:14px;min-width:250px}.branch{position:relative}.branch:before{content:'';position:absolute;left:-25px;top:24px;width:24px;border-top:1px solid #b0c6a5}.branch p{font-size:12px;margin:6px 0 0;color:#748075}.empty{padding:48px;text-align:center;color:#748075}.table-scroll{overflow:auto}table{width:100%;min-width:950px;border-collapse:collapse;text-align:left}th,td{padding:16px;vertical-align:top;border-bottom:1px solid #dce2d9}th{font-weight:500;color:#748075;font-size:12px}td{font-size:13px}small{color:#748075}#paper{padding:8px 14px;border:1px solid #dce2d9;border-radius:5px;text-decoration:none;white-space:nowrap}
</style></head><body><main><a href="../index.html#experiments">← 返回实验</a><header><h1 id="title"></h1><a id="paper" hidden></a></header><section><h2>实验思路</h2><div id="map" class="map"></div></section><section><h2>实验对照</h2><div class="table-scroll"><table><thead><tr><th>做了什么实验</th><th>为什么做</th><th>怎么做</th><th>关键指标怎么变</th><th>能得出什么结论</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script src="projects.js"></script><script>
const library=/*PAPER_LIBRARY*/,records=/*EXPERIMENT_RECORDS*/,selected=ExperimentProjects.selected();
const record=records[selected.id]||{},items=record.experiments||[];
document.getElementById('title').textContent=selected.title;document.title=selected.title+' · PaperTrail';
const paper=library.find(p=>p.pid===record.paperPid||p.title.trim().toLowerCase()===selected.paper.trim().toLowerCase());
if(paper){const link=document.getElementById('paper');link.hidden=false;link.textContent=paper.title+' · 论文精读 →';link.href='../index.html#paper='+paper.pid;}
function render(chosen){const rows=document.getElementById('rows');rows.replaceChildren();for(const item of items.filter(x=>!chosen||x.id===chosen)){const tr=document.createElement('tr');for(const value of [item.question,item.reason,item.method,(item.metrics||[]).map(m=>m.label+'：'+m.before+' → '+m.after+(m.unit||'')+'（'+m.batch+'）').join('\n'),item.conclusion]){const td=document.createElement('td');td.textContent=value||'待填写';td.style.whiteSpace='pre-line';tr.append(td);}rows.append(tr);}if(!items.length){const td=document.createElement('td');td.colSpan=5;td.className='empty';td.textContent='还没有实验记录。';const tr=document.createElement('tr');tr.append(td);rows.append(tr);}}
const map=document.getElementById('map');if(items.length){const root=document.createElement('button');root.textContent=selected.title;root.onclick=()=>render();map.append(root);const branches=document.createElement('div');branches.className='branches';for(const item of items){const branch=document.createElement('div');branch.className='branch';const button=document.createElement('button');button.textContent=item.question;button.onclick=()=>render(item.id);const p=document.createElement('p');p.textContent=item.conclusion;branch.append(button,p);branches.append(branch);}map.append(branches);}else{map.className='empty';map.textContent='从一个想验证的问题开始，添加第一条实验记录。';}render();
</script></body></html>
